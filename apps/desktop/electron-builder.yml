appId: ar.com.stockflow.desktop
productName: StockFlow
copyright: Copyright © 2026 StockFlow

directories:
  buildResources: build
  output: release

# Qué va adentro de app.asar: la lista COMPLETA está en `files` de cada plataforma
# (mac/win/linux, más abajo) y a propósito NO hay un bloque `files` global.
# electron-builder 24 convierte el `files` global en un FileSet aparte y manda los
# patrones de la plataforma al matcher principal; si ese matcher trae sólo
# negaciones (como pasaba con los filtros de onnxruntime-node) le antepone `**/*`
# y empaqueta TODO apps/desktop (src, manual-src, electron con sus tests…: +30 MB
# en la 1.12.0/1.12.1). Al tocar estas listas, comprobar con `package:dry` que en
# `release/builder-debug.yml` → `firstOrDefaultFilePatterns` empiece con `dist/**/*`
# y que el asar tenga en la raíz sólo package.json, dist, dist-electron y node_modules.
#
# Patrones comunes a las tres plataformas:
#  - dist/**/*, dist-electron/**/*, package.json
#  - "!**/node_modules/@stockflow/**": los workspace packages van bundleados en
#    dist-electron/main.mjs (y son devDependencies, así que ni se recorren).
#  - "!**/node_modules/onnxruntime-node/script/**": onnxruntime-node (lector PaddleOCR
#    de "Facturas por teléfono") trae los binarios de TODAS las plataformas (~290 MB)
#    y un script de instalación que no se usa; a cada paquete va sólo el suyo.

extraResources:
  - from: ../../packages/db/migrations/local
    to: migrations/local
    filter:
      - "**/*"
  - from: build/manual.pdf
    to: manual.pdf
  # Lector de texto del sistema para "Facturas por teléfono" (programas auxiliares).
  # `ocr-mac/vision-ocr` NO está versionado: lo compila el job de Mac del
  # release (.github/workflows/release.yml, universal) o `native/ocr-mac/compilar.sh`
  # a mano. Si falta, este filtro lo saltea EN SILENCIO: por eso el workflow
  # falla si no quedó el binario.
  # `ocr-paddle` (PaddleOCR sobre ONNX Runtime; principal en Windows, respaldo en
  # Mac): el script corre con el propio Electron como Node y carga onnxruntime-node
  # y jpeg-js desde app.asar / app.asar.unpacked (no van acá). Los modelos (12,7 MB)
  # SÍ están versionados.
  - from: native
    to: ocr
    filter:
      - "ocr-mac/vision-ocr"
      - "ocr-win/leer.ps1"
      - "ocr-paddle/leer.mjs"
      - "ocr-paddle/modelos/**"

asar: true
# onnxruntime-node queda entero en app.asar.unpacked sin pedirlo: electron-builder
# desempaqueta el paquete completo al ver sus .dylib/.dll/.so (unpackDetector).
# jpeg-js y onnxruntime-common se desempaquetan también para que leer.mjs pueda
# cargar todo desde app.asar.unpacked si no pudiera leer el asar (segunda vía;
# la primera es app.asar, que Electron en modo Node lee). Con pnpm los patrones
# se comparan contra la ruta REAL del archivo (.pnpm/...), por eso van con `**/`
# y sin `node_modules/` adelante.
asarUnpack:
  - "**/*.node"
  - "**/jpeg-js/**"
  - "**/onnxruntime-common/**"

mac:
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  # En producción, configurar CSC_LINK + CSC_KEY_PASSWORD para firmar y notarizar.
  # Mientras tanto, builds locales sin firma (Gatekeeper exigirá "Abrir de todos modos").
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  files:
    - dist/**/*
    - dist-electron/**/*
    - package.json
    - "!**/node_modules/@stockflow/**"
    - "!**/node_modules/onnxruntime-node/script/**"
    # onnxruntime-node: sólo el binario de esta plataforma y arquitectura.
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{linux,win32}/**"
    # Intel: onnxruntime-node 1.30 no trae binario darwin/x64 (en esas Mac lee sólo Vision).
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/!(${arch})/**"
    # libonnxruntime.1.30.0.dylib es una copia byte a byte de libonnxruntime.1.dylib
    # (npm no conserva symlinks); el binding carga @rpath/libonnxruntime.1.dylib. −44 MB.
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/*/libonnxruntime.1.30.0.dylib"

dmg:
  background: build/dmg-background.png
  iconSize: 96
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  files:
    - dist/**/*
    - dist-electron/**/*
    - package.json
    - "!**/node_modules/@stockflow/**"
    - "!**/node_modules/onnxruntime-node/script/**"
    # onnxruntime-node: sólo win32/x64. Van también DirectML.dll, dxcompiler.dll y
    # dxil.dll (37 MB): el lector usa sólo CPU y no deberían hacer falta, pero no
    # se probó en una PC con Windows que onnxruntime.dll cargue sin ellas.
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/!(${arch})/**"

nsis:
  # Descarga COMPLETA siempre (sin diferencial por bloques). El diferencial
  # necesita el instalador de la versión anterior en la caché del updater, y en
  # las PC donde StockFlow se instaló a mano (pendrive) esa caché no existe: la
  # actualización tiraba error de escritura, reintentaba y volvía a bajar varias
  # veces. Baja unos MB más, pero anda siempre. (Leo Citzia, 12-ago-2026)
  differentialPackage: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # "always": el acceso directo del escritorio se vuelve a crear en CADA
  # actualización (como hacen Slack, Discord o Teams). Con `true` sólo se creaba
  # al instalar por primera vez y, al actualizar, Windows seguía mostrando el
  # ícono viejo guardado en su caché (Denver, 29-sep-2026). Contra: si el
  # comercio lo borró a propósito, vuelve a aparecer.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: StockFlow
  # Al terminar, le avisa a Windows que refresque los íconos (ver installer.nsh).
  include: build/installer.nsh

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
  icon: build/icon.png
  files:
    - dist/**/*
    - dist-electron/**/*
    - package.json
    - "!**/node_modules/@stockflow/**"
    - "!**/node_modules/onnxruntime-node/script/**"
    # onnxruntime-node: sólo linux/x64.
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,win32}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/!(${arch})/**"

publish:
  - provider: github
    owner: brunomartinpasquetta-dot
    repo: stockflow-desktop
    # Repo público: el updater baja latest.yml/.exe por URL directa SIN token.
    # Con private:true el cliente necesitaría GH_TOKEN y el auto-download fallaba.
    private: false
    # El workflow sobreescribe esto con EP_DRAFT=true cuando la VERSIÓN lleva
    # sufijo (1.13.0-beta.1) y se publica desde su tag: la beta sale como
    # BORRADOR, que no aparece en /releases/latest ni en la API sin token. (Como
    # PRERELEASE les llegaba a los que eligieron el canal Beta: con GitHub,
    # electron-builder escribe latest.yml también en las betas, y
    # electron-updater con allowPrerelease toma la entrada más nueva del feed.)
    # Ojo: el TAG de un borrador sí es público y puede figurar en releases.atom;
    # por eso la vía preferida para una beta es "Run workflow" sobre la rama,
    # que no crea tag ni release (queda como artefacto del run). Ver
    # .github/workflows/release.yml y docs/RELEASE_PROCESS.md.
    releaseType: release
