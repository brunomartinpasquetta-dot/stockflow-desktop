appId: ar.com.stockflow.desktop
productName: StockFlow
copyright: Copyright © 2026 StockFlow

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  # Los workspace packages (@stockflow/*) ya están bundleados en dist-electron/main.mjs;
  # excluirlos del traversal de node_modules para evitar el bucle de symlinks de pnpm.
  - "!**/node_modules/@stockflow/**"

extraResources:
  - from: ../../packages/db/migrations/local
    to: migrations/local
    filter:
      - "**/*"
  - from: build/manual.pdf
    to: manual.pdf

asar: true
asarUnpack:
  - "**/*.node"
# Nota: SumatraPDF.exe NO se desempaqueta acá (el asarUnpack con pnpm no funcionó,
# v0.1.39). Se copia a resources/ vía extraResources en electron-builder.win.yml.

mac:
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  # En producción, configurar CSC_LINK + CSC_KEY_PASSWORD para firmar y notarizar.
  # Mientras tanto, builds locales sin firma (Gatekeeper exigirá "Abrir de todos modos").
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.icns

dmg:
  background: build/dmg-background.png
  iconSize: 96
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  # Descarga COMPLETA siempre (sin diferencial por bloques). El diferencial
  # necesita el instalador de la versión anterior en la caché del updater, y en
  # las PC donde StockFlow se instaló a mano (pendrive) esa caché no existe: la
  # actualización tiraba error de escritura, reintentaba y volvía a bajar varias
  # veces. Baja unos MB más, pero anda siempre. (Leo Citzia, 12-ago-2026)
  differentialPackage: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StockFlow

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
  icon: build/icon.png

publish:
  - provider: github
    owner: brunomartinpasquetta-dot
    repo: stockflow-desktop
    # Repo público: el updater baja latest.yml/.exe por URL directa SIN token.
    # Con private:true el cliente necesitaría GH_TOKEN y el auto-download fallaba.
    private: false
    # El workflow sobreescribe esto con EP_PRE_RELEASE=true cuando el tag lleva
    # sufijo -beta. Un release marcado como prerelease queda EXCLUIDO de
    # /releases/latest, así una beta nunca le llega a un cliente en canal estable.
    releaseType: release
