# Config de Windows: hereda todo de electron-builder.yml y SOLO desactiva el
# rebuild de nativos que hace electron-builder.
#
# Por qué: en el runner de Windows con pnpm, electron-builder intenta recompilar
# `usb` con `pnpm rebuild usb`, pero invoca `pnpm.cjs` como ejecutable
# (fork/exec) y Windows lo rechaza ("%1 is not a valid Win32 application").
# Eso hacía fallar TODOS los builds de Windows (v0.1.x solo generaba .dmg).
#
# Los nativos (better-sqlite3, usb, @serialport/bindings-cpp) YA quedan
# compilados para win32-x64 por el `postinstall` (electron-rebuild) durante
# `pnpm install`, así que el rebuild de electron-builder es redundante.
# npmRebuild debe ser booleano real (electron-builder compara con `=== false`),
# por eso va en YAML y no como `-c.npmRebuild=false` (que llega como string).
#
# Scope: SOLO Windows. macOS sigue usando electron-builder.yml con su rebuild
# multi-arch (x64 + arm64) intacto.
extends: electron-builder.yml
npmRebuild: false

# Impresión directa en Windows: SumatraPDF.exe DEBE quedar FUERA del asar para
# poder ejecutarse. El asarUnpack con pnpm no lo logró (v0.1.39: el .exe quedó
# adentro de app.asar, inejecutable). Lo copiamos a `resources/SumatraPDF.exe`
# con extraResources (determinístico) y lo ejecutamos por ruta absoluta.
extraResources:
  - from: node_modules/pdf-to-printer/dist/SumatraPDF-3.4.6-32.exe
    to: SumatraPDF.exe
