name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  # Disparo manual: a veces GitHub no genera el evento del push del tag y el
  # release queda sin compilar (pasó con v0.2.5 y v0.2.6). Con esto se puede
  # lanzar contra el tag sin tener que quemar una versión nueva —y sin borrar
  # el tag, que se llevaría puesto el release.
  workflow_dispatch:

permissions:
  contents: write # crear el release y subir los artefactos con el GITHUB_TOKEN integrado

jobs:
  build:
    strategy:
      fail-fast: false
      # DE A UNO. En paralelo, los dos jobs consultaban "¿existe el release?",
      # los dos veían que no y los dos lo creaban: el segundo moría con
      # "422 already_exists" y quedaba la versión publicada para un solo sistema
      # operativo (pasó en la v0.4.6, con el cliente esperando el .exe).
      # Serializado, macOS crea el release y Windows sube los suyos al que ya
      # está. Tarda unos minutos más y sale siempre.
      max-parallel: 1
      # WINDOWS PRIMERO. El release se publica apenas termina el primer job y
      # GitHub ya lo reporta como "la última versión": si arranca macOS, el
      # cliente (Windows) recibe el aviso de versión nueva ~7 minutos ANTES de
      # que exista su .exe y su latest.yml. Resultado: aviso sin nada que
      # descargar y el update automático sin arrancar. Pasó con la v0.4.14, con
      # el cliente mirando la pantalla.
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stockflow/desktop run build:web
      - run: pnpm --filter @stockflow/desktop run build:electron
      - name: Publish (macOS)
        if: matrix.os == 'macos-latest'
        # GH_TOKEN: usa el PAT secrets.GH_TOKEN si existe; si no (vacío/expirado),
        # cae al GITHUB_TOKEN integrado (siempre presente). Sin token, electron-builder
        # aborta con "GitHub Personal Access Token is not set".
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          # Tag con sufijo -beta → se publica como PRERELEASE (no llega al canal
          # estable de los clientes). Tag vX.Y.Z limpio → release final.
          EP_PRE_RELEASE: ${{ contains(github.ref_name, '-beta') }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm --filter @stockflow/desktop run publish:mac
      - name: Publish (Windows)
        if: matrix.os == 'windows-latest'
        # SIN code signing: el .exe se publica sin firmar (SmartScreen pedirá
        # "Más información → Ejecutar de todas formas"). NO pasar CSC_LINK aquí:
        # si el secret no existe llega como string vacío "", y electron-builder
        # lo trata como ruta de certificado (CSC_LINK != null) → intenta resolver
        # "" y falla con "WIN_CSC_LINK is not correct, cannot resolve ... not a file".
        # Dejándolo sin definir (undefined), electron-builder saltea la firma.
        # GH_TOKEN: PAT si existe, si no el GITHUB_TOKEN integrado (ver job mac).
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          # Tag con sufijo -beta → se publica como PRERELEASE (no llega al canal
          # estable de los clientes). Tag vX.Y.Z limpio → release final.
          EP_PRE_RELEASE: ${{ contains(github.ref_name, '-beta') }}
        run: pnpm --filter @stockflow/desktop run publish:win
