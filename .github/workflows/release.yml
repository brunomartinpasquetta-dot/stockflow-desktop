name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  # Disparo manual: a veces GitHub no genera el evento del push del tag y el
  # release queda sin compilar (pasó con v0.2.5 y v0.2.6). Con esto se puede
  # lanzar contra el tag sin tener que quemar una versión nueva —y sin borrar
  # el tag, que se llevaría puesto el release.
  workflow_dispatch:

permissions:
  contents: write # crear el release y subir los artefactos con el GITHUB_TOKEN integrado

jobs:
  build:
    strategy:
      fail-fast: false
      # DE A UNO. En paralelo, los dos jobs consultaban "¿existe el release?",
      # los dos veían que no y los dos lo creaban: el segundo moría con
      # "422 already_exists" y quedaba la versión publicada para un solo sistema
      # operativo (pasó en la v0.4.6, con el cliente esperando el .exe).
      # Serializado, macOS crea el release y Windows sube los suyos al que ya
      # está. Tarda unos minutos más y sale siempre.
      max-parallel: 1
      # WINDOWS PRIMERO. El release se publica apenas termina el primer job y
      # GitHub ya lo reporta como "la última versión": si arranca macOS, el
      # cliente (Windows) recibe el aviso de versión nueva ~7 minutos ANTES de
      # que exista su .exe y su latest.yml. Resultado: aviso sin nada que
      # descargar y el update automático sin arrancar. Pasó con la v0.4.14, con
      # el cliente mirando la pantalla.
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # QUÉ SE PUBLICA lo decide la VERSIÓN del package.json, no el nombre del
      # ref. electron-builder sube todo al release `v<versión del package.json>`:
      #  - El disparo tiene que ser el tag `v<versión>`. Con "Run workflow" sobre
      #    una RAMA, el ref no dice "-beta" y una versión de prueba salía como
      #    release NORMAL: /releases/latest la tomaba y TODOS los clientes la
      #    bajaban solos. Y un tag que no coincide con la versión subía los
      #    archivos a otro release (o a ninguno, sin error).
      #  - Versión con sufijo (1.13.0-beta.1) → BORRADOR (draft). No aparece en
      #    /releases/latest ni en la API sin token: no la recibe ningún cliente
      #    en canal Estable. OJO: el TAG sí es público y GitHub puede listarlo en
      #    releases.atom, que es lo que mira el canal "Beta" (allowPrerelease):
      #    esos clientes lo tomarían como la versión más nueva y quedarían sin
      #    actualizarse (404 en su latest.yml) hasta el release siguiente. Por
      #    eso la beta se compila SIN tag (abajo) y esta vía queda de respaldo.
      #  - Versión con sufijo + "Run workflow" sobre una RAMA → se compila y el
      #    instalador queda como ARTEFACTO del run (Actions → el run →
      #    Artifacts, con la sesión de GitHub). Sin tag ni release: nada en
      #    /releases/latest, en releases.atom ni en la API, y ningún "Publish
      #    release" que apretar por error.
      #  - Versión sin sufijo (1.12.2) → release normal, como siempre (sólo
      #    desde su tag).
      - name: Versión y tipo de publicación
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "Versión del paquete: $VERSION · disparo: $GITHUB_EVENT_NAME, $GITHUB_REF_TYPE '$GITHUB_REF_NAME'"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
            case "$VERSION" in
              *-*)
                echo "SOLO_ARTEFACTO=true" >> "$GITHUB_ENV"
                echo "Versión de prueba desde la rama '$GITHUB_REF_NAME' → se compila SIN publicar: queda como artefacto del run (sin tag ni release)."
                exit 0 ;;
              *)
                echo "::error::Desde una rama sólo se compilan versiones de prueba (con sufijo, p. ej. 1.13.0-beta.1). La versión final $VERSION se publica desde su tag v$VERSION."
                exit 1 ;;
            esac
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Se publica sólo desde el tag v$VERSION (este disparo es $GITHUB_REF_TYPE '$GITHUB_REF_NAME'). Con 'Run workflow', elegir el TAG en 'Use workflow from', no una rama."
            exit 1
          fi
          case "$VERSION" in
            *-*)
              echo "EP_DRAFT=true" >> "$GITHUB_ENV"
              echo "Versión de prueba → se publica como BORRADOR (draft): no le llega a ningún cliente." ;;
            *)
              echo "Versión final → release normal." ;;
          esac
      - run: pnpm install --frozen-lockfile
      # La KB de Flowy y su motor se validan ANTES de compilar: un intents.json
      # roto brickearía el asistente en todos los clientes con auto-update.
      - run: pnpm --filter @stockflow/desktop run test:kb
      - run: pnpm --filter @stockflow/desktop run test:assistant
      - run: pnpm --filter @stockflow/desktop run test:consultas
      - run: pnpm --filter @stockflow/desktop run test:flows
      - run: pnpm --filter @stockflow/desktop run test:demo
      - run: pnpm --filter @stockflow/desktop run test:onboarding
      # Facturación electrónica: que el pedido de CAE siga llevando la condición
      # frente al IVA del receptor (RG 5616). Sin ese campo ARCA rechaza TODOS
      # los comprobantes desde el 1/12/2026 — no puede romperse en silencio.
      - run: pnpm --filter @stockflow/desktop run test:fiscal-xml
      # "Facturas por teléfono": el armado de renglones y el vinculador de
      # artículos son TypeScript puro (sin base de datos): corren acá con node.
      - run: pnpm --filter @stockflow/desktop run test:facturas-parser
      - run: pnpm --filter @stockflow/desktop run test:facturas-asociador
      # Publicación: la versión tiene su entrada de novedades, una versión de
      # prueba no muestra ventana, y las de prueba salen como borrador.
      - run: pnpm --filter @stockflow/desktop run test:publicacion
      # Lector de texto del sistema para "Facturas por teléfono" en Mac
      # (apps/desktop/native/ocr-mac/vision-ocr). NO está versionado: se compila
      # acá, universal (Intel + Apple Silicon). Si falta, el paquete de Mac
      # saldría sin lector y la función obligaría a instalar Ollama; por eso el
      # job falla si no quedó el binario (electron-builder lo copia en silencio).
      - name: Compilar lector del sistema (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          sh apps/desktop/native/ocr-mac/compilar.sh
          test -x apps/desktop/native/ocr-mac/vision-ocr
          lipo -info apps/desktop/native/ocr-mac/vision-ocr
      - run: pnpm --filter @stockflow/desktop run build:web
      - run: pnpm --filter @stockflow/desktop run build:electron
      - name: Publish (macOS)
        if: matrix.os == 'macos-latest' && env.SOLO_ARTEFACTO != 'true'
        # GH_TOKEN: usa el PAT secrets.GH_TOKEN si existe; si no (vacío/expirado),
        # cae al GITHUB_TOKEN integrado (siempre presente). Sin token, electron-builder
        # aborta con "GitHub Personal Access Token is not set".
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          # Borrador o release normal: EP_DRAFT lo fija el paso "Versión y tipo
          # de publicación" (versión con sufijo → borrador).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm --filter @stockflow/desktop run publish:mac
      - name: Publish (Windows)
        if: matrix.os == 'windows-latest' && env.SOLO_ARTEFACTO != 'true'
        # SIN code signing: el .exe se publica sin firmar (SmartScreen pedirá
        # "Más información → Ejecutar de todas formas"). NO pasar CSC_LINK aquí:
        # si el secret no existe llega como string vacío "", y electron-builder
        # lo trata como ruta de certificado (CSC_LINK != null) → intenta resolver
        # "" y falla con "WIN_CSC_LINK is not correct, cannot resolve ... not a file".
        # Dejándolo sin definir (undefined), electron-builder saltea la firma.
        # GH_TOKEN: PAT si existe, si no el GITHUB_TOKEN integrado (ver job mac).
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          # Borrador o release normal: ver el paso "Versión y tipo de publicación".
        run: pnpm --filter @stockflow/desktop run publish:win
      # VERSIÓN DE PRUEBA SIN PUBLICAR ("Run workflow" sobre una rama): el mismo
      # paquete, con --publish=never y sin GH_TOKEN (no puede subir nada).
      - name: Compilar sin publicar (versión de prueba, Windows)
        if: matrix.os == 'windows-latest' && env.SOLO_ARTEFACTO == 'true'
        run: pnpm --filter @stockflow/desktop exec node scripts/package.mjs --win --publish=never --config electron-builder.win.yml
      - name: Compilar sin publicar (versión de prueba, macOS)
        if: matrix.os == 'macos-latest' && env.SOLO_ARTEFACTO == 'true'
        run: pnpm --filter @stockflow/desktop exec node scripts/package.mjs --mac --publish=never
      - name: Guardar el instalador como artefacto del run (versión de prueba)
        if: env.SOLO_ARTEFACTO == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stockflow-prueba-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14
      # El lector de Windows (PaddleOCR sobre onnxruntime-node) viaja como
      # recursos extra + módulo nativo desempaquetado. electron-builder los copia
      # en silencio: si faltan, la función lee con el lector nativo de Windows,
      # que midió peor. Se comprueba sobre lo que se acaba de empaquetar.
      - name: Verificar lector de facturas en el paquete (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $base = "apps/desktop/release/win-unpacked/resources"
          foreach ($f in @(
            "$base/ocr/ocr-paddle/leer.mjs",
            "$base/ocr/ocr-paddle/modelos/ch_PP-OCRv5_det_mobile.onnx",
            "$base/ocr/ocr-paddle/modelos/latin_PP-OCRv5_rec_mobile.onnx",
            "$base/ocr/ocr-win/leer.ps1",
            "$base/app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/onnxruntime.dll",
            "$base/app.asar.unpacked/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/onnxruntime_binding.node"
          )) {
            if (-not (Test-Path -LiteralPath $f)) { Write-Error "FALTA en el paquete: $f"; exit 1 }
            Write-Host "OK $f"
          }
